<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F1E9FA; --ink:#3A2050; --muted:#7A6690;
  --btn:#FF5D8F; --btn-edge:#C93A6A; --ticket:#FFFDF7; --slot:#D9C9EE;
  --amo-bg:#FFE3EB; --heart:#E5223F;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#241733; --ink:#F3E9FF; --muted:#B7A3D0;
    --btn:#FF7AA2; --btn-edge:#B54A72; --ticket:#372450; --slot:#160E22;
    --amo-bg:#3A1526; --heart:#FF4D6A;
  }
}
:root[data-theme="dark"]{
  --bg:#241733; --ink:#F3E9FF; --muted:#B7A3D0;
  --btn:#FF7AA2; --btn-edge:#B54A72; --ticket:#372450; --slot:#160E22;
  --amo-bg:#3A1526; --heart:#FF4D6A;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{
  margin:0; min-height:100%; background:var(--bg); color:var(--ink);
  font-family:'Fredoka',system-ui,-apple-system,'Segoe UI',sans-serif;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:1.5rem; padding:1.5rem; text-align:center;
}
h1{font-size:clamp(1.9rem,7vw,2.8rem);font-weight:600;margin:0;line-height:1.1}
.sub{margin:.5rem 0 0;color:var(--muted);font-size:1.05rem}
.sub2{margin:.35rem auto 0;font-size:1rem;max-width:22rem}
header{text-align:center}
.btn{
  width:min(50vw,200px); aspect-ratio:1; border-radius:50%; border:0; cursor:pointer;
  background:var(--btn); color:#fff; font:inherit; font-size:1.6rem; font-weight:600;
  box-shadow:0 10px 0 var(--btn-edge); transition:transform .08s, box-shadow .08s;
  -webkit-tap-highlight-color:transparent; touch-action:manipulation; -webkit-user-select:none; user-select:none;
}
.btn:active{transform:translateY(8px);box-shadow:0 2px 0 var(--btn-edge)}
.btn:focus-visible,.continua:focus-visible{outline:4px solid var(--ink);outline-offset:6px}
.slot{
  width:min(90vw,380px); min-height:14rem; padding:1rem; border-radius:1.25rem;
  background:var(--slot); display:flex; align-items:flex-start; justify-content:center;
}
.ticket{
  width:100%; padding:1.25rem 1.1rem; border-radius:.9rem; background:var(--ticket);
  border:2px dashed var(--muted); font-size:1.2rem; line-height:1.45; font-weight:500;
}
.ticket.empty{color:var(--muted);font-weight:400;border-color:transparent;background:transparent}
.ticket.drop{animation:drop .45s cubic-bezier(.3,1.4,.5,1)}
@keyframes drop{from{transform:translateY(-140%);opacity:0}to{transform:none;opacity:1}}

.amo{
  position:fixed; inset:0; z-index:10; background:var(--amo-bg);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:1rem; padding:1.5rem; text-align:center;
}
.amo[hidden]{display:none}
.amo svg{width:clamp(96px,30vw,150px);height:auto;fill:var(--heart);animation:beat 1.2s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.15)}30%{transform:scale(1)}45%{transform:scale(1.1)}}
.amo h2{margin:0;font-size:clamp(3rem,17vw,5.5rem);font-weight:600;letter-spacing:.04em;line-height:1}
.conta{margin:0;color:var(--muted);font-size:1rem}
.continua{
  position:absolute; right:1.5rem; bottom:calc(1.5rem + env(safe-area-inset-bottom,0px));
  padding:.8rem 1.5rem; border:0; border-radius:999px; cursor:pointer;
  background:var(--btn); color:#fff; font:inherit; font-size:1.15rem; font-weight:600;
  box-shadow:0 5px 0 var(--btn-edge);
}
.continua:active{transform:translateY(4px);box-shadow:0 1px 0 var(--btn-edge)}
@media (prefers-reduced-motion:reduce){.ticket.drop,.amo svg{animation:none}.btn{transition:none}}
</style>
</head>
<body>
<header>
  <h1>Distributore di Sorrisi</h1>
  <p class="sub">Un sorriso a richiesta. Offre la casa.</p>
  <p class="sub sub2">30 frasi per ricordare i 30 giorni che stiamo insieme 🫶</p>
</header>

<button class="btn" id="btn" type="button">Premi</button>

<div class="slot" aria-live="polite">
  <div class="ticket empty" id="ticket">Premi il bottone e ritira il tuo sorriso.</div>
</div>

<section class="amo" id="amo" hidden aria-label="Ti amo">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
  <h2>TI AMO</h2>
  <p class="conta" id="conta"></p>
  <button class="continua" id="continua" type="button">Continua</button>
</section>

<script>
const frasi = [
  "Buon anniversario! 💖",
  "Hai un sorriso che sistema le giornate storte. Quindi sorridi sempre.",
  "Hai il permesso ufficiale di essere giù quando vuoi. Io resto qui lo stesso.",
  "Ogni giorno con te è una cosa in più che non sapevo di volere.",
  "Sei una persona forte, e la parte migliore è che non te ne accorgi nemmeno.",
  "Con te non servono piani perfetti. Basta che ci sei tu.",
  "Oggi offre la casa: un abbraccio a richiesta (o quello che vuoi), ritiro appena ci vediamo.",
  "Sei la persona che vorrei accanto anche nel giorno peggiore.",
  "Il tuo sorriso mi ha contagiato dalla prima volta che l'ho visto.",
  "Sei la persona più speciale che conosca.",
  "Sei bellissima oggi (come sempre).",
  "Adoro il modo in cui sorridi.",
  "Sei di gran lunga la mia notifica preferita.",
  "Anche in tuta e spettinata, non smetterei di guardarti.",
  "Qualsiasi cosa succeda, affrontiamo tutto insieme.",
  "Mi piace il modo in cui mi guardi. Eh sì, hai gli occhi grandi e che occhi mamma mia.",
  "Amo il tuo sguardo.",
  "Amo quando mi parli con la vocina che sembri una bambina.",
  "Amo tutte le tue espressioni... Anche da incazzata 😁",
  "Adoro come riesci sempre a capirmi, spero di farlo anch'io.",
  "Mi piace anche quando mi fai ingelosire (nei limiti prego ahaha).",
  "Adoro il fatto che posso essere me stesso al 100% quando sto con te, anche se sono imbranato.",
  "Prometto di sopportare i tuoi sbalzi d'umore (come fai tu con i miei ahah).",
  "Amo le tue mani, tantissimo. Vorrei tenerle sempre incollate alle mie (anche se sudano, non mi interessa ahaha).",
  "Sei la mia vita ❤️",
  "Ti amo Noemi 🖤",
  "Sei tu il mio posto preferito.",
  "Mi fa impazzire che mi fai ridere tanto.",
  "Sei una bella persona, spero che col tempo lo saprai anche tu.",
  "Con te non bastano 24 ore, mi fai stare troppo bene. Spero di farlo anch'io, anche se sono impacciato ahah."
];

const btn = document.getElementById('btn');
const ticket = document.getElementById('ticket');
const amo = document.getElementById('amo');
const conta = document.getElementById('conta');
const continua = document.getElementById('continua');
let mazzo = [], ultima = -1, premuti = 0;

function pesca(){
  if(!mazzo.length){
    mazzo = frasi.map((_, i) => i);
    for(let i = mazzo.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [mazzo[i], mazzo[j]] = [mazzo[j], mazzo[i]];
    }
    if(mazzo[mazzo.length - 1] === ultima) mazzo.reverse(); // niente doppioni di fila
  }
  ultima = mazzo.pop();
  return frasi[ultima];
}

btn.addEventListener('click', () => {
  premuti++;
  ticket.classList.remove('empty', 'drop');
  void ticket.offsetWidth; // riavvia l'animazione
  ticket.textContent = pesca();
  ticket.classList.add('drop');

  if(premuti % 10 === 0){ // ogni 10 click: schermata TI AMO
    btn.disabled = true;
    setTimeout(() => {
      const n = premuti / 10;
      conta.textContent = "Fin qui te l'ho detto " + n + (n === 1 ? " volta" : " volte");
      amo.hidden = false;
      continua.focus();
    }, 1400); // il tempo di leggere la frase
  }
});

continua.addEventListener('click', () => {
  amo.hidden = true;
  btn.disabled = false;
  btn.focus();
});
</script>
</body>
</html>
